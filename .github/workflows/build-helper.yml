name: Building Uploader Helper
on: [push]
env:
  ZIG_VERSION: 0.15.2
jobs:
  lint:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2.2.0
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check .
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2.2.0
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Show Zig version
        run: zig version
      - name: Build executables
        run: zig build -Dversion="${{ github.ref_name }}" -Doptimize=ReleaseFast
        env:
          GITHUB_REF: ${{ github.ref }}
      - name: Change permissions for binaries
        run: chmod +x zig-out/bin/helper-linux zig-out/bin/helper-macos-arm64 zig-out/bin/helper-macos-x64
      - name: Create universal macOS binary
        run: lipo -create zig-out/bin/helper-macos-arm64 zig-out/bin/helper-macos-x64 -output zig-out/bin/helper-macos
      - name: Create artifact zip
        run: zip -r uploader-helper.zip zig-out/bin/
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uploader-helper
          path: uploader-helper.zip
      - name: Release
        uses: softprops/action-gh-release@v2.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: uploader-helper.zip
